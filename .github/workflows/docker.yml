# Build and publish the Decaynet images to GitHub Container Registry so
# docker-compose.yml (and Portainer stacks) can pull them:
#   ghcr.io/<owner>/decaynet          (app)
#   ghcr.io/<owner>/decaynet-migrate  (migration runner)
# Tags: latest + main (pushes to main), sha-<short>, and X.Y.Z / X.Y for v* tags.
name: Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only changes don't need new images
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: runtime
            image: decaynet
          - target: migrate
            image: decaynet-migrate
    steps:
      - uses: actions/checkout@v4

      - name: Lower-case image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          # "latest" follows main explicitly ({{is_default_branch}} is false when the
          # repo's default branch is something else, which left no :latest tag)
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
