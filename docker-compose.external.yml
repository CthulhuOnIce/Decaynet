# Decaynet against an EXTERNAL Supabase (Supabase Cloud, your own self-hosted
# Supabase, or `npx supabase start`). For the all-in-one stack with Supabase
# included, use docker-compose.yml instead.
# Portainer-friendly: no build steps or bind mounts; settings come from
# environment variables (Portainer stack variables, or a .env file for the CLI).
# SPDX-License-Identifier: AGPL-3.0-or-later
#
#   docker compose -f docker-compose.external.yml run --rm migrate   # apply schema
#   docker compose -f docker-compose.external.yml up -d app          # http://localhost:3000

services:
  app:
    image: ${DECAYNET_IMAGE:-ghcr.io/cthulhuonice/decaynet:latest}
    restart: unless-stopped
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:?Set PUBLIC_SUPABASE_URL}
      PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY:?Set PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      ADDRESS_HEADER: ${ADDRESS_HEADER:-}
      XFF_DEPTH: ${XFF_DEPTH:-1}
    ports:
      - "${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  migrate:
    image: ${DECAYNET_MIGRATE_IMAGE:-ghcr.io/cthulhuonice/decaynet-migrate:latest}
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}   # the runner explains if it is missing
      SEED: ${SEED:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
