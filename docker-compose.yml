# Decaynet — app container + optional migration runner.
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Supabase itself (Postgres+PostGIS, Auth, Storage) runs separately:
#   * Supabase Cloud, or
#   * self-hosted Supabase (https://supabase.com/docs/guides/self-hosting/docker), or
#   * `npx supabase start` on the host for local development.
#
#   cp .env.example .env            # fill in keys
#   docker compose --profile tools run --rm migrate   # apply schema (+ SEED=1 for demo data)
#   docker compose up -d app        # http://localhost:3000

services:
  app:
    build:
      context: .
      target: runtime
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    image: decaynet:latest
    env_file: .env
    environment:
      # Public URL of the site. Required by SvelteKit's form CSRF protection.
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      # Behind a reverse proxy, uncomment so tips see the visitor's real IP:
      # ADDRESS_HEADER: X-Forwarded-For
      # XFF_DEPTH: "1"
    ports:
      - "${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: migrate
      args:
        PG_IMAGE: ${PG_IMAGE:-postgres:17-alpine}
    image: decaynet-migrate:latest
    environment:
      DATABASE_URL: ${DATABASE_URL:-}   # the runner explains if it is missing
      SEED: ${SEED:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
