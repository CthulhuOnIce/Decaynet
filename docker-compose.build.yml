# Build the Decaynet images from this checkout instead of pulling them from GHCR.
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# SPDX-License-Identifier: AGPL-3.0-or-later
services:
  migrate:
    image: decaynet-migrate:local
    build:
      context: .
      target: migrate
      args:
        PG_IMAGE: ${PG_IMAGE:-postgres:17-alpine}
  app:
    image: decaynet:local
    build:
      context: .
      target: runtime
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
